<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intégration de Bootstrap</title>

    <!-- CSS -->
    <link rel="stylesheet" href="CSS/style.css">

    <!-- Bootstrap 5 -CSS- -->
    <link rel="stylesheet" href="public/bootstrap/dist/css/bootstrap.css">
</head>
<body>

  <!-- header -->
  <header class="bg-light">
    <div class="container bg-secondary" style="height: 50px;">
    </div>
  </header>

  <!-- main -->
  <main>
   <section class="container p-0">
    <div class="d-flex py-5">
      <div class="col">
        <h1>
          Je suis John Doe Développeur et Designer Web
        </h1>
        <p>
          Bienvenue dans mon univers creatif
        </p>
        <button>
          Mon expertise Web
        </button>
      </div>
      <div class="col">
       <img class="img-fluid" src="images/portrait.jpg" alt="image portrait">
      </div>
    </div>
   </section>

    <section class="container p-0">
      <div>
        <h1>
          Mon expertise
        </h1>
        <p>
          Développement web et design
        </p>
      </div>
      <div class="d-flex justify-content-between py-5">
        <div class="col-7 bg-secondary">
        </div>
        <div class="col-4">
          <img class="img-fluid" src="images/code.jpg" alt="image du code">
        </div>
      </div>
    </section>

    <section class="container p-0">
      <div class="d-flex flex-row-reverse justify-content-between py-5">
        <div class="col-7 bg-secondary">
        </div>
        <div class="col-4">
          <img class="img-fluid" src="images/design.jpg" alt="image du designe">
        </div>
      </div>
    </section>

    <section class="container p-0">
      <div class="col">
        <h1>
          Mon portfolio
        </h1>
        <p>
          Projets perso et pro
        </p>
      </div>

      <div class="container my-4 p-0">
        <div class="row">
          <div class="col" style="height: 100px;">
            <div class="bg-secondary h-100">
            </div>
          </div>
          <div class="col" style="height: 100px;">
            <div class="bg-secondary h-100">
            </div>
          </div>
          <div class="col" style="height: 100px;">
            <div class="bg-secondary h-100">
            </div>
          </div>
          <div class="col" style="height: 100px;">
            <div class="bg-secondary h-100">
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="container p-0">
      <div class="col">
        <h1>
          Un projet de création web ?
        </h1>
        <p>
          Allons en discuter autour d'un café
        </p>
      </div>
      
      <div class="d-flex justify-content-between py-5">
        <div class="col-5">
          <img class="img-fluid" src="images/design.jpg" alt="image du designe">
        </div>
        <div class="col-6 bg-secondary">
        </div>
      </div>
    </section>
  </main>

  <!-- footer -->
  <footer class="container p-0">
    <div class="row">
      <div class="col" style="height: 100px;">
        <div class="bg-secondary h-100">
        </div>
      </div>
      <div class="col" style="height: 100px;">
        <div class="bg-secondary h-100">
        </div>
      </div>
      <div class="col" style="height: 100px;">
        <div class="bg-secondary h-100">
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap 5 -JS  -->
    <script src="public/bootstrap/dist/js/bootstrap.bundle.js"></script>
</body>
</html>
