<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tp exercice</title>
    <!-- css -->
    <link rel="stylesheet" href="public/bootstrap/dist/css/bootstrap.css">

    <!-- Include Bootstrap Icons CSS -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

</head>
<body>
    <!-- header -->
    <header class="bg-light">
        <div class="container">
            <div class="bg-secondary p-4"></div>
        </div>
    </header>

    <!-- main -->
    <main>
       <section class="my-5">
            <div class="container">
                <div class="row gy-4 gy-md-0">
                    <div class="col-12 col-md-6 align-self-center">
                        <h1 class="fw-bold">
                            Je suis John Doe Développeur et Designer web
                        </h1>
                        <p class="fw-light">
                            Bienvenue dans mon univers créatif
                        </p>
                        <button type="button" class="btn btn-primary">
                            Mon expertise Web
                        </button>
                    </div>
                    <div class="col-12 col-md-6">
                        <img class="img-fluid" src="images/portrait.jpg" alt="portrait">
                    </div>
                </div>
            </div>
       </section>

        <section class="bg-light my-5">

            <div class="container ">
                <h1 class="fw-bold">
                    Mon expertise 
                </h1>
                <p class="fw-light">
                    Developpement web et design
                </p>
                
                <div class="row gy-4 gy-md-0">
                    <div class="col-12 col-md-7">
                        <div class="bg-secondary h-100 w-100 p-4"></div>
                    </div>
                    <div class="col-12 col-md-4 offset-md-1">
                        <img class="img-fluid" src="images/code.jpg" alt="image du code">
                    </div>
                </div>
                <div class="row flex-row-reverse gy-4 gy-md-0 my-5">
                    <div class="col-12 col-md-7 offset-md-1">
                        <div class="bg-secondary h-100 w-100 p-4"></div>
                    </div>
                    <div class="col-12 col-md-4">
                        <img class="img-fluid" src="images/design.jpg" alt="image du design">
                    </div>
                </div>
            </div>

        </section>

        <section class="bg-light my-5">
            <div class="container">
                <h1 class="fw-bold">
                    Mon projet
                </h1>
                <p class="fw-light">
                    Projets perso et pro
                </p>

                <div class="row gy-4 gy-md-0">
                    <div class="col-12 col-md-3 my-3 my-md-0">
                        <div class="bg-secondary h-100 w-100 p-4"></div>
                    </div>
                    <div class="col-12 col-md-3 my-3 my-md-0">
                        <div class="bg-secondary h-100 w-100 p-4"></div>
                    </div>
                    <div class="col-12 col-md-3 my-3 my-md-0">
                        <div class="bg-secondary h-100 w-100 p-4"></div>
                    </div>
                    <div class="col-12 col-md-3 my-3 my-md-0">
                        <div class="bg-secondary h-100 w-100 p-4"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="my-5">
            <div class="container">
                <h1 class="fw-bold">
                    Un projet de création ?
                </h1>
                <p class="fw-light">
                    Allons en discuter autour d'un café
                </p>
                <div class="row flex-row-reverse gy-4 gy-md-0">
                    <div class="col-12 col-md-7 offset-md-1">
                        <div class="bg-secondary h-100 w-100 p-4"></div>
                    </div>
                    <div class="col-12 col-md-4">
                        <img class="img-fluid" src="images/grab-a-coffee.jpg" alt="image du café">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- footer -->
    <footer>
        <div class="container">
            <div class="row gy-4 gy-md-0">
                <div class="col-12 col-md-4 my-3 my-md-0">
                    <div class="bg-secondary h-100 w-100 p-4"></div>
                </div>
                <div class="col-12 col-md-4 my-3 my-md-0">
                    <div class=" h-100 w-100 p-4">
                        <p class="fs-4 text-center">
                            <a href="#" class="text-body text-decoration-none">Mention Legal</a>
                        </p>
                    </div>
                </div>
                <div class="col-12 col-md-4 my-3 my-md-0">
                    <div class="text-end h-100 w-100 p-4">
                        <a href="https://www.facebook.com/" class="text-decoration-none fs-2 text-body">
                            <i class="bi bi-facebook"></i>
                        </a>
                        <a href="https://www.instagram.com/" class="text-decoration-none fs-2 text-body">
                            <i class="bi bi-instagram"></i>
                        </a>
                        <a href="https://web.whatsapp.com/" class="text-decoration-none fs-2 text-body">
                            <i class="bi bi-whatsapp"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <link rel="stylesheet" href="public/bootstrap/dist/js/bootstrap.bundle.js">
</body>
</html>
